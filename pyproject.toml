[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signops"
version = "0.2.0"
description = "SignOps for Python: push notifications to Android, iOS and the web, push approval of logins, passkeys and webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "SignOps", email = "hello@signops.dev" }]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Typing :: Typed"]
keywords = ["push notifications", "fcm", "apns", "web push", "passkeys", "webauthn", "push authentication", "signops"]

[project.urls]
Homepage = "https://signops.dev/"
Documentation = "https://signops.dev/docs/"
Repository = "https://github.com/signops-dev/signops-python"
Issues = "https://github.com/signops-dev/signops-python/issues"
